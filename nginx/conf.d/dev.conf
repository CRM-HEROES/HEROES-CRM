server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;
    # Imports (CSV/XLSX) are uploaded through POST /api/project/{project}/import.
    # Without this, nginx keeps its 1 MB default and answers 413 before PHP runs.
    # Kept in line with app.conf/hiscale.conf (50M) and below php post_max_size (60M).
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass heroescrm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.ht {
        deny all;
    }
}
