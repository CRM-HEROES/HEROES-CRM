services:
  heroescrm:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: host.docker.internal

  supervisor:
    environment:
      DB_HOST: host.docker.internal

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  webserver:
    ports: !override
      - "8080:80"
    volumes: !override
      - ./:/var/www:ro
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  certbot:
    profiles:
      - prod
