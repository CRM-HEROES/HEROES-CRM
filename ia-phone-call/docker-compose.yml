services:

  ia-phone-call:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ia-phone-call
    restart: unless-stopped
    env_file:
      - .env

    ports:
      - "${AUDIOSOCKET_PORT:-9701}:${PORT:-9701}"
      - "${API_PORT:-3000}:3000"

    volumes:
      - calls_data:/data/calls

    networks:
      - ia-phone-net

    depends_on:
      asterisk:
        condition: service_healthy


  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile.asterisk
    container_name: ia-asterisk
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - TZ=${TZ:-Europe/Paris}

    ports:
      - "${SIP_PORT:-5060}:5060/udp"
      - "${SIP_TLS_PORT:-5061}:5061/udp"
      - "${SIP_TLS_PORT:-5061}:5061/tcp"
      - "10000-10099:10000-10099/udp"
      # Asterisk Manager Interface (AMI) - pour appels sortants
      - "5038:5038/tcp"

    volumes:
      - ./asterisk/pjsip.conf.template:/etc/asterisk/pjsip.conf.template:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/manager.conf:/etc/asterisk/manager.conf:ro
      - calls_data:/var/spool/asterisk/monitor

    networks:
      - ia-phone-net

    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  calls_data:


networks:
  ia-phone-net:
    driver: bridge