[general]
static=yes
writeprotect=no

[from-kavkom]
; Redirige n'importe quel numéro entrant depuis Kavkom vers le serveur IA
exten => _X.,1,NoOp(--- Appel entrant Kavkom pour l'IA Gemini ---)
 same => n,Answer()
 same => n,Wait(1) ; Court délai pour stabiliser le canal audio RTP
 ; UUID unique + adresse IP:Port de votre passerelle Node.js
 ; En Docker : ia-phone-call est le nom du service Node.js sur le réseau bridge
 ; En hôte natif : remplacer ia-phone-call par 127.0.0.1
 same => n,AudioSocket(12345678-1234-1234-1234-123456789abc,ia-phone-call:9701)
 same => n,Hangup()

[outgoing-call]
; Context pour les appels sortants lancés par ia-phone-call
; Utilisé par: ia-phone-call API → Asterisk → Kavkom → Destinataire
exten => s,1,NoOp(--- Appel sortant depuis l'IA Gemini vers Kavkom ---)
 same => n,Answer()
 same => n,Wait(1) ; Stabilisation de l'appel SIP
 same => n,AudioSocket(${CALLID},ia-phone-call:9701)
 same => n,Hangup()