[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
timestampevents = yes
httptimeout = 60

; Compte utilisé par ia-phone-call (src/services/outgoing-call.service.js).
; Asterisk refuse toute action AMI sur une session non authentifiée
; ("Message: Permission denied"), d'où le Login obligatoire côté service.
; Surchargeable dans .env via ASTERISK_AMI_USERNAME / ASTERISK_AMI_SECRET —
; garder les deux fichiers synchronisés.
[default]
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.0
permit = 172.0.0.0/255.0.0.0
permit = 192.168.0.0/255.255.0.0
permit = 10.0.0.0/255.0.0.0

secret = HeroesAmi2026!

read = all
write = all
