[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2
; Free a worker that is stuck (slow API call, locked query) instead of keeping it forever.
; Aligned on php.ini max_execution_time (60) and kept below nginx fastcgi_read_timeout.
request_terminate_timeout = 60s
; Pool metrics (active / idle / listen queue), reachable from inside the docker network only:
;   SCRIPT_NAME=/fpm-status SCRIPT_FILENAME=/fpm-status REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000
pm.status_path = /fpm-status
