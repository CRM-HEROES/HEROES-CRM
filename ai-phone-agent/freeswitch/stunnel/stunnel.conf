; Tunnel TLS local -> Kavkom, avec SNI forcé.
; sofia-sip (mod_sofia) ne propage pas le nom d'hôte au transport TLS
; secondaire créé pour le REGISTER sortant, donc le ClientHello part sans
; extension SNI. Kavkom héberge plusieurs domaines derrière la même IP et
; route par SNI : sans lui, le serveur ferme la connexion avec l'alerte TLS
; "unrecognized_name" (confirmé avec openssl s_client -servername vs sans).
; stunnel gère ici la connexion TLS sortante réelle et fixe le SNI lui-même,
; FreeSWITCH ne lui parle qu'en clair sur 127.0.0.1.
pid = /var/run/stunnel/stunnel.pid
foreground = yes
debug = 4
output = /dev/stdout

[kavkom]
client = yes
accept = 127.0.0.1:15062
connect = aria-madacom.kavkom.com:5061
sni = aria-madacom.kavkom.com
verifyChain = yes
CApath = /etc/ssl/certs
checkHost = aria-madacom.kavkom.com