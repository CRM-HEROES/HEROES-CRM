version: '3'
services:
  #PHP Service
  heroescrm:
    build:
      context: .
      dockerfile: Dockerfile
    image: heroescrm:latest
    container_name: heroescrm
    restart: always
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: production
      PHP_MEMORY_LIMIT: 128M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./storage/:/var/www/storage/
      - ./storage/logs/:/var/www/storage/logs/
      - ./ImageMagick-6/policy.xml:/etc/ImageMagick-6/policy.xml
    ports:
      - "127.0.0.1:9001:9000"
    command: php-fpm
    networks:
      - heroes-network

  # Redis Service
  redis:
    image: "redis:alpine"
    container_name: redis-heroes
    restart: unless-stopped
    networks:
      - heroes-network
    volumes:
      - ./redis:/var/lib/redis/data
    env_file:
      - .env
      
  # MySQL Service
  mysql:
    image: mysql:8.0
    container_name: mysql-heroes
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: heroes
    volumes:
      - ./mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - heroes-network

  # Adminer service
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "18085:8080"
    depends_on:
      - mysql
    networks:
      - heroes-network

  #Nginx Service
  webserver:
    image: nginx:latest
    container_name: nginx
    restart: always
    tty: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www:ro
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/app.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/www/:/var/www/certbot/
      - ./certbot/conf/:/etc/letsencrypt/
    links:
      - heroescrm
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    networks:
      - heroes-network

  #Certbot Service
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www/:/var/www/certbot/
      - ./certbot/conf/:/etc/letsencrypt/
      - ./var_log_letsencrypt:/var/log/letsencrypt
   #entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --dry-run; sleep 12h & wait $${!}; done;'"
    command: certonly --webroot -w /var/www/certbot --force-renewal --email devops@diris.fr -d heroescrm.io --agree-tos  
    networks:
      - heroes-network

  #Supervisor service
  supervisor:
    image: heroescrm:latest
    container_name: supervisor
    restart: always
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: production
      PHP_MEMORY_LIMIT: 128M
      working_dir: /var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
       - ./:/var/www
       - ./storage/:/var/www/storage/
       - ./storage/logs/:/var/www/storage/logs/
       - ./supervisor/worker.conf:/etc/supervisor/conf.d/worker.conf
    depends_on:
      - heroescrm
      - webserver
    command: supervisord --nodaemon --configuration /etc/supervisor/conf.d/worker.conf
    networks:
      - heroes-network

  # ia-phone-call Service
  ia-phone-call:
    build:
      context: ./ia-phone-call
      dockerfile: Dockerfile
      target: production
    container_name: ia-phone-call
    restart: unless-stopped
    env_file:
      - ./ia-phone-call/.env
    ports:
      - "${AUDIOSOCKET_PORT:-9701}:${PORT:-9701}"
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./ia-phone-call/recordings:/app/recordings
      - calls_data:/data/calls
    networks:
      - heroes-network
      - ia-phone-net
    depends_on:
      asterisk:
        condition: service_healthy

  # Asterisk Service (remplace la stack FreeSWITCH / ai-phone-agent)
  asterisk:
    build:
      context: ./ia-phone-call/asterisk
      dockerfile: Dockerfile.asterisk
    container_name: ia-asterisk
    restart: unless-stopped
    env_file:
      - ./ia-phone-call/.env
    environment:
      - TZ=${TZ:-Europe/Paris}
    ports:
      - "${SIP_PORT:-5060}:5060/udp"
      - "${SIP_TLS_PORT:-5061}:5061/udp"
      - "${SIP_TLS_PORT:-5061}:5061/tcp"
      - "10000-10099:10000-10099/udp"
      - "5038:5038/tcp"
    volumes:
      - ./ia-phone-call/asterisk/pjsip.conf.template:/etc/asterisk/pjsip.conf.template:ro
      - ./ia-phone-call/asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./ia-phone-call/asterisk/manager.conf:/etc/asterisk/manager.conf:ro
      - calls_data:/var/spool/asterisk/monitor
    networks:
      - ia-phone-net
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 10s
      timeout: 5s
      retries: 5

#Docker Networks
networks:
  heroes-network:
    driver: bridge
  ia-phone-net:
    driver: bridge

volumes:
  calls_data:
